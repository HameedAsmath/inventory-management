services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Asmath@2001
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: backend-app
    # Self-healing start command (same pattern that fixed dev):
    # ensures deps + prisma client are present, runs migrations, then starts the server.
    command: sh -c "npm install --omit=dev && npx prisma generate && npx prisma migrate deploy && node dist/index.js"
    restart: always
    environment:
      # Make sure the Node app listens on the same port docker-compose publishes.
      PORT: 8000
    ports:
      - "8000:8000"
      - "2222:2222"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres-data:
